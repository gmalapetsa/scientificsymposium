και με ποια κριτήρια αποφασίζει για τη χρήση της τεχνητής νοημοσύνης στο σχολείο, πώς μπορούν να συμμετέχουν ουσιαστικά εκπαιδευτικοί, γονείς και παιδιά, και ποιες αρχές χρειάζεται να συμφωνηθούν."],R=["Εκπαιδευτικούς πρωτοβάθμιας και δευτεροβάθμιας εκπαίδευσης","Διευθυντές και διευθύντριες σχολικών μονάδων","Στελέχη εκπαιδευτικής εποπτείας","Ψυχολόγους και κοινωνικούς λειτουργούς","Γονείς και κηδεμόνες","Φορείς τοπικής αυτοδιοίκησης","Πανεπιστημιακούς και ερευνητές","Τους ίδιους τους μαθητές και τις μαθήτριες των σχολείων της περιοχής"],z={tower:(0,o.jsxs)(o.Fragment,{children:[(0,o.jsx)("path",{d:"M22 40 L22 16 L28 10 L36 10 L42 16 L42 40",fill:"none",stroke:"currentColor",strokeWidth:"2.5",strokeLinecap:"round",strokeLinejoin:"round"}),(0,o.jsx)("path",{d:"M30 10 L30 4 M34 10 L34 4 M28 6 L36 6",fill:"none",stroke:"currentColor",strokeWidth:"2",strokeLinecap:"round"})]}),monastery:(0,o.jsxs)(o.Fragment,{children:[(0,o.jsx)("path",{d:"M12 40 L12 22 L32 8 L52 22 L52 40",fill:"none",stroke:"currentColor",strokeWidth:"2.5",strokeLinecap:"round",strokeLinejoin:"round"}),(0,o.jsx)("path",{d:"M32 8 L32 2 M28 4 L36 4",fill:"none",stroke:"currentColor",strokeWidth:"2",strokeLinecap:"round"}),(0,o.jsx)("path",{d:"M24 40 L24 28 L40 28 L40 40",fill:"none",stroke:"currentColor",strokeWidth:"2",strokeLinecap:"round",strokeLinejoin:"round"})]}),houses:(0,o.jsxs)(o.Fragment,{children:[(0,o.jsx)("path",{d:"M8 40 L8 26 L20 16 L32 26 L32 40",fill:"none",stroke:"currentColor",strokeWidth:"2.5",strokeLinejoin:"round"}),(0,o.jsx)("path",{d:"M28 40 L28 22 L42 12 L56 22 L56 40",fill:"none",stroke:"currentColor",strokeWidth:"2.5",strokeLinejoin:"round"})]})},D=[{name:"Άγναντα",role:"Παρασκευή & Σάββατο βράδυ",text:"Δήμος Κεντρικών Τζουμέρκων. Δύο βραδιές εισηγήσεων, βιωματικών εργαστηρίων μαθητών και ανοιχτού διαλόγου με την τοπική κοινότητα.",icon:"tower"},{name:"Καλαρρύτες",role:"Σάββατο πρωί",text:"Εκδρομή στην Ιερά Μονή Κηπίνας. Ελεύθερη πολιτιστική δραστηριότητα, χωρίς επιστημονικό π
